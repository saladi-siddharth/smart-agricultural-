version: '3.8'

services:
  farmpilot:
    build: .
    container_name: farmpilot-app
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
