<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#0D2820" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(110, 231, 183, 0.3)" stroke-width="8" />

  <!-- Precision Radar & Field Furrow Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(167, 243, 208, 0.12)" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(167, 243, 208, 0.18)" stroke-width="2" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="rgba(167, 243, 208, 0.22)" stroke-width="1.5" />

  <!-- Crosshair Precision Targets -->
  <line x1="256" y1="40" x2="256" y2="90" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="422" x2="256" y2="472" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
  <line x1="40" y1="256" x2="90" y2="256" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
  <line x1="422" y1="256" x2="472" y2="256" stroke="#34D399" stroke-width="4" stroke-linecap="round" />

  <!-- Soil Mound / Furrows -->
  <path d="M120 370 Q 256 340 392 370 Q 256 400 120 370 Z" fill="#047857" opacity="0.6" />
  <path d="M150 400 Q 256 375 362 400 Q 256 425 150 400 Z" fill="#065F46" opacity="0.4" />

  <!-- Central Autonomous Seedling Sprout -->
  <g filter="url(#glow)">
    <!-- Right Leaf -->
    <path d="M256 350 C260 270 370 230 380 150 C300 150 250 240 256 350 Z" fill="url(#leafGrad)" />
    <!-- Left Leaf -->
    <path d="M256 350 C252 280 160 250 140 180 C210 170 254 250 256 350 Z" fill="#059669" />
    <!-- Center Stem -->
    <path d="M256 360 L256 220" stroke="#A7F3D0" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Golden Telemetry Crown / Spark -->
  <circle cx="380" cy="150" r="14" fill="url(#goldGrad)" />
  <circle cx="140" cy="180" r="10" fill="#34D399" />
  <circle cx="256" cy="210" r="8" fill="#FCD34D" />
</svg>
